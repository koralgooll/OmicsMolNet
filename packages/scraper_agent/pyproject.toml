[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicsmolnet-scraper-agent"
version = "0.1.0"
description = "LangGraph-based agentic pipeline for scraping UniProt publication data"
requires-python = ">=3.11"
dependencies = [
  "omicsmolnet-core",
  "langgraph>=0.2",
  "langchain>=0.2",
  "langchain-anthropic",
  "pydantic>=2",
  "pyyaml",
  "requests",
  "beautifulsoup4",
]

[project.scripts]
omicsmolnet-scraper = "omicsmolnet_scraper_agent.cli:main"

[project.optional-dependencies]
test = ["pytest"]
dev = ["ruff", "mypy"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
